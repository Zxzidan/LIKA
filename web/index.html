<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LIKA Agrowisata Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LIKA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LIKA Agrowisata</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <script>
    // Ensure Flutter Web re-syncs layout whenever Mobile Simulator extension
    // changes devicePixelRatio or viewport dimensions dynamically.
    (function () {
      var lastDpr = window.devicePixelRatio;
      var lastW = window.innerWidth;
      var lastH = window.innerHeight;
      setInterval(function () {
        if (
          window.devicePixelRatio !== lastDpr ||
          window.innerWidth !== lastW ||
          window.innerHeight !== lastH
        ) {
          lastDpr = window.devicePixelRatio;
          lastW = window.innerWidth;
          lastH = window.innerHeight;
          window.dispatchEvent(new Event('resize'));
        }
      }, 350);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
